<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#080a0f" />
<title>兰台 · 公开数据目录</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar" data-lt-topbar></header>

<main id="main" tabindex="-1">
  <div class="container">
    <div class="home">
      <section class="home__intro">
        <p class="eyebrow">公开数据平台</p>
        <h1 class="home-title"><span class="w">兰台</span></h1>
        <p class="naming">取自《汉书·百官公卿表》，喻数据典藏之机构</p>
        <p class="home__lede">
          以不可变 Schema 编目、数据集级快照发布；任何人可匿名贡献，管理员审阅后合并发布。
        </p>

        <div class="cta">
          <a class="btn btn--primary" href="/submit">贡献数据</a>
          <a class="btn" href="/docs/">开放接口</a>
        </div>

        <search class="box">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
          <label class="sr-only" for="q">搜索数据集、字段与数据内容</label>
          <input id="q" type="search" role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list"
            placeholder="搜索数据集、字段或数据内容…" autocomplete="off" spellcheck="false" enterkeyhint="search" />
          <span class="kbd">⌘K</span>
        </search>

        <div class="chips" id="chips"><span class="lb">试试：</span></div>
      </section>

      <section class="home__catalog" aria-labelledby="catalog-title">
        <div class="spread home__catalog-head">
          <h2 id="catalog-title">数据目录</h2>
          <a href="/search">跨数据集搜索 →</a>
        </div>
        <div class="meta-row">
          <span id="scope">正在加载数据目录…</span>
          <span id="cstatus" class="muted" role="status" aria-live="polite"></span>
          <a href="/index.json">读取原始索引 index.json →</a>
        </div>

        <div class="results" id="results" role="listbox" aria-label="数据集与搜索结果"></div>
      </section>
    </div>
  </div>
</main>

<footer class="sitefoot" data-lt-footer></footer>

<script src="/app.js"></script>
<script>
  (() => {
    "use strict";

    LT.mountShell({ active: "catalog" });

    /* 单集内容索引预取预算：全部 termCount 之和不超过它时，后台预取全部单集索引，让内容搜索即时。 */
    const CONTENT_PREFETCH_BUDGET = 5000;
    /* 单集索引的并发上限。 */
    const MAX_CONCURRENT = 4;
    /* 预览表格每批渲染的行数。 */
    const PAGE_SIZE = 50;

    const ACTIONS = [
      { label: "贡献数据", desc: "匿名提交符合 Schema 的内容", kw: "提交 投稿 贡献 上传", href: "/submit" },
      { label: "文档", desc: "静态 JSON 接口与缓存说明", kw: "文档 接口 api json 下载 开放", href: "/docs/" },
      { label: "查询进度", desc: "凭追踪令牌查看提交状态", kw: "查询 进度 状态 令牌 token", href: "/status" },
      { label: "控制台", desc: "编目、审阅与发布", kw: "控制台 后台 管理 审阅 发布", href: "/admin" },
      { label: "读者指南", desc: "读者 / 贡献者 / 运营者指南", kw: "说明 帮助 文档 指南 读者", href: "/docs/reader.html" }
    ];

    /* 来自 /search/index.json 的精简全局索引：{ slug,title,schemaVersion,dataVersion,fields,termCount }，不含 terms。 */
    let docs = [];
    const resultsEl = document.getElementById("results");
    const input = document.getElementById("q");
    const scopeEl = document.getElementById("scope");
    const cstatusEl = document.getElementById("cstatus");
    const chipsEl = document.getElementById("chips");
    let flat = [];
    let selKey = "";
    const snapshotCache = {};

    /* 单集内容索引缓存：slug -> 已小写、以换行连接的 terms 字符串（空串表示已加载但无匹配/失败）。 */
    const contentCache = Object.create(null);
    const contentLoading = Object.create(null);
    const contentQueue = [];
    let activeLoads = 0;

    /* ---------- 小工具 ---------- */
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function mark(text, term) {
      const e = esc(text);
      if (!term) return e;
      const i = e.toLowerCase().indexOf(term.toLowerCase());
      if (i < 0) return e;
      return `${e.slice(0, i)}<span class="hl">${e.slice(i, i + term.length)}</span>${e.slice(i + term.length)}`;
    }
    function isPlainValueArray(v) {
      return Array.isArray(v) && v.every((x) => x === null || typeof x !== "object");
    }
    function arrayText(arr) {
      if (!arr.length) return "—";
      return arr.map((x) => (x == null ? "—" : String(x))).join("、");
    }
    function nameText(d) { return `${d.slug} ${d.title || ""}`; }
    function fieldsText(d) { return (d.fields || []).map((f) => `${f.name} ${f.title || ""} ${f.type || ""}`).join(" "); }
    function isRowArray(data) { return Array.isArray(data); }

    /* ---------- 单集内容索引：按需加载 + 缓存 + 并发受限 ---------- */
    function contentLoaded(slug) { return contentCache[slug] !== undefined; }

    function enqueueContent(slug) {
      if (contentLoaded(slug) || contentLoading[slug]) return;
      contentLoading[slug] = true;
      contentQueue.push(slug);
      pumpContent();
    }
    function pumpContent() {
      while (activeLoads < MAX_CONCURRENT && contentQueue.length) {
        const slug = contentQueue.shift();
        activeLoads++;
        fetch(`/${encodeURIComponent(slug)}/search-index.json`, { headers: { accept: "application/json" } })
          .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then((idx) => {
            const terms = Array.isArray(idx?.terms) ? idx.terms : [];
            contentCache[slug] = terms.join("\n").toLowerCase();
          })
          .catch(() => { contentCache[slug] = ""; })
          .then(() => {
            activeLoads--;
            delete contentLoading[slug];
            onContentLoaded(slug);
            pumpContent();
          });
      }
    }
    function hasPendingContent(term) {
      if (!term) return false;
      return docs.some((d) => (d.termCount || 0) > 0 && !contentLoaded(d.slug));
    }
    /* 有内容可搜（termCount>0）的数据集视为「相关数据集」，按需入队。 */
    function requestContentForSearch(term) {
      if (!term) return;
      docs.forEach((d) => { if ((d.termCount || 0) > 0) enqueueContent(d.slug); });
    }
    function contentMatch(d, term) {
      const c = contentCache[d.slug];
      return !!c && c.indexOf(term) !== -1;
    }
    const scheduleRender = LT.debounce(() => render(), 80);
    function onContentLoaded() {
      const term = (input.value || "").trim().toLowerCase();
      if (term) scheduleRender();
      else updateCstatus();
    }
    function updateCstatus() {
      const term = (input.value || "").trim().toLowerCase();
      cstatusEl.textContent = term && hasPendingContent(term) ? "正在检索数据内容…" : "";
    }

    /* ---------- 结果构建 ---------- */
    function build(term) {
      const groups = [];
      const ds = [];
      docs.forEach((d) => {
        if (!term) { ds.push({ d: d, why: "" }); return; }
        if (nameText(d).toLowerCase().indexOf(term) !== -1) ds.push({ d: d, why: "名称" });
        else if (fieldsText(d).toLowerCase().indexOf(term) !== -1) ds.push({ d: d, why: "字段" });
        else if (contentMatch(d, term)) ds.push({ d: d, why: "数据内容" });
      });
      if (ds.length) groups.push({ name: "数据集", kind: "ds", items: ds });

      if (term) {
        const fld = [];
        docs.forEach((d) => {
          (d.fields || []).forEach((f) => {
            if ((`${f.name} ${f.title || ""} ${f.type || ""}`).toLowerCase().indexOf(term) !== -1) {
              fld.push({ d: d, f: f });
            }
          });
        });
        if (fld.length) groups.push({ name: "字段", kind: "field", items: fld.slice(0, 12) });
        const act = ACTIONS.filter((a) => (`${a.label} ${a.desc} ${a.kw}`).toLowerCase().indexOf(term) !== -1);
        if (act.length) groups.push({ name: "操作", kind: "act", items: act });
      }
      return groups;
    }

    /* ---------- 表格预览（按需拉快照，分页 + 嵌套可展开） ---------- */
    function fillCell(td, v, term) {
      if (v === null || v === undefined) { td.innerHTML = mark("", term); return; }
      if (typeof v === "number") { td.className = "num"; td.textContent = v.toLocaleString("zh-CN"); return; }
      if (typeof v === "boolean") { td.innerHTML = mark(String(v), term); return; }
      if (Array.isArray(v) && isPlainValueArray(v) && v.length <= PAGE_SIZE) {
        td.innerHTML = esc(arrayText(v));
        return;
      }
      if (typeof v === "object") {
        td.classList.add("cell-tree");
        td.appendChild(LT.dataTree(v, { pageSize: PAGE_SIZE }));
        return;
      }
      td.innerHTML = mark(String(v), term);
    }

    function tableFor(doc, data, term) {
      const wrap = document.createElement("div");
      const cap = document.createElement("div");
      cap.className = "opt__cap";
      const rowArr = isRowArray(data);
      const total = rowArr ? data.length : Object.keys(data || {}).length;
      cap.innerHTML = "<b>" + (rowArr ? "明细表" : "详情表") + "</b> · 最新快照 v" + esc(doc.dataVersion || "—") +
        " · " + (rowArr ? `${total} 行` : "1 条记录") + " · Schema " + esc(doc.schemaVersion || "—");
      wrap.appendChild(cap);

      const t = document.createElement("table");
      t.className = rowArr ? "pv" : "pv kv";
      const keys = (doc.fields?.length)
        ? doc.fields.map((f) => f.name)
        : (rowArr && data[0] ? Object.keys(data[0]) : Object.keys(data || {}));
      const titleOf = {};
      (doc.fields || []).forEach((f) => { titleOf[f.name] = f.title || f.name; });

      const foot = document.createElement("div");
      foot.className = "opt__foot";
      const moreBtn = document.createElement("button");
      moreBtn.type = "button";
      moreBtn.className = "btn btn--ghost btn--sm";
      moreBtn.style.display = "none";
      const codeEl = document.createElement("code");
      codeEl.textContent = `/${doc.slug}/latest.json`;
      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "copy";
      copyBtn.textContent = "复制地址";
      copyBtn.setAttribute("data-copy", `${location.origin}/${doc.slug}/latest.json`);
      foot.appendChild(moreBtn);
      foot.appendChild(codeEl);
      foot.appendChild(copyBtn);

      if (rowArr) {
        const thead = document.createElement("thead");
        const htr = document.createElement("tr");
        keys.forEach((k) => { const th = document.createElement("th"); th.scope = "col"; th.textContent = titleOf[k] || k; htr.appendChild(th); });
        thead.appendChild(htr); t.appendChild(thead);
        const tb = document.createElement("tbody");
        t.appendChild(tb);
        let shown = 0;
        const updateMore = () => {
          if (shown >= total) { moreBtn.style.display = "none"; return; }
          moreBtn.style.display = "";
          moreBtn.textContent = `加载更多（还有 ${total - shown} 行）`;
        };
        const loadMore = () => {
          const end = Math.min(shown + PAGE_SIZE, total);
          for (; shown < end; shown++) {
            const row = data[shown];
            const tr = document.createElement("tr");
            keys.forEach((k) => {
              const td = document.createElement("td");
              fillCell(td, row ? row[k] : "", term);
              tr.appendChild(td);
            });
            tb.appendChild(tr);
          }
          updateMore();
        };
        moreBtn.addEventListener("click", loadMore);
        loadMore();
      } else {
        const tb2 = document.createElement("tbody");
        keys.forEach((k) => {
          const tr = document.createElement("tr");
          const th = document.createElement("th"); th.scope = "row"; th.textContent = titleOf[k] || k;
          const td = document.createElement("td");
          fillCell(td, data ? data[k] : "", term);
          tr.appendChild(th); tr.appendChild(td); tb2.appendChild(tr);
        });
        t.appendChild(tb2);
      }
      const tw = document.createElement("div");
      tw.className = "table-wrap";
      tw.appendChild(t);
      wrap.appendChild(tw);
      wrap.appendChild(foot);
      return wrap;
    }

    function fieldTable(doc, field, term) {
      const wrap = document.createElement("div");
      const cap = document.createElement("div");
      cap.className = "opt__cap";
      cap.innerHTML = `<b>字段详情</b> · ${esc(doc.slug)}`;
      wrap.appendChild(cap);
      const t = document.createElement("table");
      t.className = "pv kv";
      const tb = document.createElement("tbody");
      const rows = [["字段", field.name], ["标题", field.title || "—"], ["类型", field.type || "—"], ["所属数据集", doc.title || doc.slug]];
      rows.forEach((r) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th"); th.scope = "row"; th.textContent = r[0];
        const td = document.createElement("td"); td.innerHTML = mark(r[1], term);
        tr.appendChild(th); tr.appendChild(td); tb.appendChild(tr);
      });
      t.appendChild(tb); wrap.appendChild(t);
      return wrap;
    }

    function loadSnapshot(entry, body, term) {
      const doc = entry.it.d;
      if (!doc.dataVersion) {
        body.innerHTML = '<div class="opt__inner"><p class="muted" style="padding:16px">该数据集尚未发布数据。</p></div>';
        return;
      }
      if (snapshotCache[doc.slug] !== undefined) {
        body.textContent = "";
        const inner = document.createElement("div"); inner.className = "opt__inner";
        inner.appendChild(entry.group.kind === "ds" ? tableFor(doc, snapshotCache[doc.slug], term) : fieldTable(doc, entry.it.f, term));
        body.appendChild(inner);
        return;
      }
      body.textContent = "";
      const loading = document.createElement("div"); loading.className = "opt__inner";
      const cap = document.createElement("div"); cap.className = "opt__cap";
      cap.innerHTML = "<b>载入中…</b> · 正在读取该数据集的快照";
      loading.appendChild(cap);
      loading.appendChild(LT.skeleton(5));
      body.appendChild(loading);
      fetch(`/${doc.slug}/versions/${encodeURIComponent(doc.dataVersion)}.json`)
        .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then((data) => {
          snapshotCache[doc.slug] = data;
          if (body.parentNode?.classList.contains("is-open")) {
            body.textContent = "";
            const inner2 = document.createElement("div"); inner2.className = "opt__inner";
            inner2.appendChild(entry.group.kind === "ds" ? tableFor(doc, data, term) : fieldTable(doc, entry.it.f, term));
            body.appendChild(inner2);
          }
        })
        .catch(() => {
          body.textContent = "";
          const err = document.createElement("div"); err.className = "opt__inner";
          err.innerHTML = '<div class="opt__cap"><b>无法载入快照</b></div>';
          body.appendChild(err);
        });
    }

    /* ---------- 渲染 ---------- */
    function render() {
      const term = (input.value || "").trim().toLowerCase();
      requestContentForSearch(term);
      const groups = build(term);
      flat = [];
      resultsEl.textContent = "";

      if (!groups.length) {
        const none = document.createElement("div"); none.className = "nohit";
        none.textContent = term
          ? (hasPendingContent(term)
            ? "正在检索数据内容…"
            : "没有匹配结果。换个关键词试试，或点上方「试试」里的示例。")
          : "数据目录为空。管理员发布数据集后会显示在这里。";
        resultsEl.appendChild(none);
        scopeEl.textContent = "0 个结果 · 搜索范围：数据集名称、字段与数据内容";
        input.removeAttribute("aria-activedescendant");
        selKey = "";
        updateCstatus();
        return;
      }

      groups.forEach((g) => {
        const h = document.createElement("div"); h.className = "grp"; h.textContent = g.name; resultsEl.appendChild(h);
        g.items.forEach((it) => {
          const idx = flat.length;
          const key = g.kind === "ds"
            ? `ds:${it.d.slug}`
            : g.kind === "field" ? `field:${it.d.slug}:${it.f.name}` : `act:${it.href}`;
          flat.push({ group: g, it: it, key: key });
          const row = document.createElement("div");
          row.className = "opt";
          row.setAttribute("role", "option");
          row.id = `opt-${idx}`;
          row.setAttribute("aria-selected", "false");

          let title, badge = "", dsc, icon, tail;
          if (g.kind === "ds") {
            icon = "DS"; title = it.d.title || it.d.slug;
            if (it.why) badge = `<span class="why">${esc(it.why)}命中</span>`;
            dsc = `${it.d.slug} · ${(it.d.fields || []).length} 个字段 · ${it.d.dataVersion ? `v${it.d.dataVersion}` : "未发布数据"}`;
            tail = `Schema ${it.d.schemaVersion || "—"}`;
          } else if (g.kind === "field") {
            icon = "≡"; title = it.f.title || it.f.name;
            badge = '<span class="why">字段</span>';
            dsc = `${it.f.name} · ${it.f.type || "—"} · ${it.d.slug}`;
            tail = it.d.title || "";
          } else {
            icon = "→"; title = it.label; dsc = it.desc; tail = "打开";
          }

          const hrow = document.createElement("div");
          hrow.className = "opt__row";
          hrow.innerHTML = '<span class="ic">' + esc(icon) + '</span>' +
            '<span class="tx"><span class="t">' + mark(title, term) + badge + "</span>" +
            '<span class="d">' + mark(dsc, term) + "</span></span>" +
            '<span class="tail">' + esc(tail) + "</span>";
          row.appendChild(hrow);

          if (g.kind !== "act") {
            const body = document.createElement("div");
            body.className = "opt__body";
            body.setAttribute("aria-hidden", "true");
            row.appendChild(body);
          }
          hrow.addEventListener("click", () => {
            if (g.kind === "act") { location.href = it.href; return; }
            select(idx, true);
          });
          resultsEl.appendChild(row);
        });
      });

      const n = flat.length;
      scopeEl.textContent = (term ? `命中 ${n} 项` : `共 ${docs.length} 个数据集`) +
        " · 搜索范围：数据集名称、字段与数据内容";

      /* M2：宽泛关键词命中过多时给出明确提示，避免「页面卡住」的错觉。 */
      if (term && n > 40) {
        const hint = document.createElement("div");
        hint.className = "callout callout--info";
        const hi = document.createElement("div"); hi.className = "stack"; hi.style.margin = "0";
        const hs = document.createElement("strong"); hs.textContent = `结果过多（${n} 项），请缩小范围`;
        const hp = document.createElement("p"); hp.className = "muted"; hp.style.margin = "0";
        hp.textContent = "补充关键词或改用字段名可收敛结果；内容检索仍在后台继续，加载完成前命中数可能还会增加。";
        hi.appendChild(hs); hi.appendChild(hp);
        hint.appendChild(hi);
        resultsEl.insertBefore(hint, resultsEl.firstChild);
      }

      let target = 0;
      if (selKey) {
        const j = flat.findIndex((e) => e.key === selKey);
        if (j >= 0) target = j;
      }
      select(target, false);
      updateCstatus();
    }

    function select(i, scroll) {
      const opts = resultsEl.querySelectorAll(".opt");
      if (!opts.length) return;
      i = Math.max(0, Math.min(i, opts.length - 1));
      selKey = flat[i] ? flat[i].key : "";
      const term = (input.value || "").trim().toLowerCase();
      opts.forEach((o, j) => {
        const on = j === i;
        o.setAttribute("aria-selected", on ? "true" : "false");
        const body = o.querySelector(".opt__body");
        if (!body) return;
        if (on) {
          loadSnapshot(flat[j], body, term);
          o.classList.add("is-open");
          body.setAttribute("aria-hidden", "false");
        } else {
          o.classList.remove("is-open");
          body.setAttribute("aria-hidden", "true");
        }
      });
      input.setAttribute("aria-activedescendant", opts[i].id);
      if (scroll && opts[i].scrollIntoView) opts[i].scrollIntoView({ block: "nearest" });
    }
    function activeIndex() {
      const opts = resultsEl.querySelectorAll(".opt");
      for (let j = 0; j < opts.length; j++) if (opts[j].getAttribute("aria-selected") === "true") return j;
      return 0;
    }
    function openCurrent() {
      const entry = flat[activeIndex()];
      if (!entry) return;
      if (entry.group.kind === "act") location.href = entry.it.href;
      else location.href = `/dataset?slug=${encodeURIComponent(entry.it.d.slug)}`;
    }

    /* ---------- 交互 ---------- */
    input.addEventListener("input", () => { selKey = ""; render(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); select(activeIndex() + 1, true); }
      else if (e.key === "ArrowUp") { e.preventDefault(); select(activeIndex() - 1, true); }
      else if (e.key === "Enter") { e.preventDefault(); openCurrent(); }
      else if (e.key === "Escape") { input.value = ""; selKey = ""; render(); }
    });
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); input.focus(); input.select(); }
    });
    document.addEventListener("click", (e) => {
      const b = e.target.closest(".copy");
      if (!b) return;
      const text = b.getAttribute("data-copy");
      const done = () => {
        const o = b.textContent; b.textContent = "已复制"; b.classList.add("done");
        setTimeout(() => { b.textContent = o; b.classList.remove("done"); }, 1400);
      };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
    });
    chipsEl.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-q]");
      if (!b) return;
      input.value = b.getAttribute("data-q");
      selKey = "";
      render();
      input.focus();
    });

    /* ---------- 「试试」：由字段标题推导 ---------- */
    function buildChips() {
      const terms = [];
      function add(t) {
        t = (t == null ? "" : String(t)).trim();
        if (!t || t.length > 6 || terms.indexOf(t) !== -1 || terms.length >= 5) return;
        terms.push(t);
      }
      for (let i = 0; i < docs.length && terms.length < 4; i++) {
        const fs = docs[i].fields || [];
        for (let j = 0; j < fs.length && terms.length < 4; j++) add(fs[j].title || fs[j].name);
      }
      terms.forEach((t) => {
        const b = document.createElement("button");
        b.type = "button"; b.setAttribute("data-q", t); b.textContent = t;
        chipsEl.appendChild(b);
      });
    }

    /* ---------- 载入索引（M1：加载态 / 失败态 / 重试，失败绝不呈现为「空目录」） ---------- */
    function renderCatalogSkeleton() {
      resultsEl.textContent = "";
      const wrap = document.createElement("div"); wrap.className = "cards";
      for (let i = 0; i < 3; i++) {
        const c = document.createElement("div"); c.className = "card";
        c.appendChild(LT.skeleton(3));
        wrap.appendChild(c);
      }
      resultsEl.appendChild(wrap);
    }

    function renderCatalogError(reason) {
      resultsEl.textContent = "";
      const box = document.createElement("div");
      box.className = "callout callout--danger";
      box.setAttribute("role", "alert");
      const inner = document.createElement("div");
      inner.className = "stack"; inner.style.margin = "0";
      const title = document.createElement("strong"); title.textContent = "目录加载失败";
      const msg = document.createElement("p"); msg.className = "muted"; msg.style.margin = "0";
      msg.textContent = reason + " 目录读取失败并不代表平台暂无数据，请重试。";
      const retry = document.createElement("button");
      retry.type = "button"; retry.className = "btn btn--sm"; retry.textContent = "重试";
      retry.addEventListener("click", () => loadIndex());
      const row = document.createElement("div"); row.className = "cluster"; row.appendChild(retry);
      inner.appendChild(title); inner.appendChild(msg); inner.appendChild(row);
      box.appendChild(inner);
      resultsEl.appendChild(box);
    }

    function loadIndex() {
      scopeEl.textContent = "正在加载数据目录…";
      cstatusEl.textContent = "";
      renderCatalogSkeleton();
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 10000);
      fetch("/search/index.json", { headers: { accept: "application/json" }, signal: ctl.signal })
        .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then((index) => {
          docs = (index?.datasets) || [];
          buildChips();
          render();
          input.focus();
          if (!docs.length) {
            scopeEl.textContent = "目录已加载，但平台尚无已发布数据集 · 搜索范围：数据集名称、字段与数据内容";
          }
          const totalTerms = docs.reduce((n, d) => n + (d.termCount || 0), 0);
          if (totalTerms <= CONTENT_PREFETCH_BUDGET) {
            docs.forEach((d) => { if ((d.termCount || 0) > 0) enqueueContent(d.slug); });
          }
        })
        .catch((err) => {
          renderCatalogError(
            err && err.name === "AbortError"
              ? "读取数据目录超时（10 秒）。"
              : `无法读取数据目录（${(err && err.message) || "网络错误"}）。`,
          );
          scopeEl.textContent = "目录加载失败 · 可点击重试";
        })
        .finally(() => clearTimeout(timer));
    }

    loadIndex();
  })();
</script>
</body>
</html>
