<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080a0f" />
  <title>跨数据集搜索 · 兰台 LanTai</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar" data-lt-topbar></header>

  <main id="main" tabindex="-1">
    <div class="container stack-lg">
      <section class="pagehead">
        <p class="eyebrow">检索</p>
        <h1>跨数据集搜索</h1>
        <p class="lede">
          在静态索引 <code>/search/index.json</code> 上，按数据集名称与字段即时过滤；
          命中数据内容时，按需加载对应数据集的完整索引 <code>/{slug}/search-index.json</code>（客户端缓存、并发受限）。
        </p>
      </section>

      <form id="search-form" class="searchbar">
        <label class="sr-only" for="q">关键词</label>
        <input id="q" class="input" type="search" placeholder="例如：人口、name、常住…" autocomplete="off" />
        <button type="submit" class="btn btn--primary">搜索</button>
        <button type="button" class="btn btn--ghost" id="clear-btn">清空</button>
      </form>

      <p class="muted" id="count" role="status" aria-live="polite">正在加载搜索索引…</p>
      <div id="results"></div>
    </div>
  </main>

  <footer class="sitefoot" data-lt-footer></footer>

  <script src="/app.js"></script>
  <script>
    (() => {
      "use strict";
      LT.mountShell({ active: "search" });

      /* 数据集条目数不超过它时，后台预取全部单集索引，让内容搜索即时。 */
      const CONTENT_PREFETCH_DOCS = 6;
      /* 单集索引的并发上限。 */
      const MAX_CONCURRENT = 4;

      const form = LT.$("#search-form");
      const input = LT.$("#q");
      const clearBtn = LT.$("#clear-btn");
      const countEl = LT.$("#count");
      const results = LT.$("#results");
      let docs = [];

      /* 单集内容索引缓存：slug -> 已小写、以换行连接的 terms 字符串（空串表示已加载但无匹配/失败）。 */
      const contentCache = Object.create(null);
      const contentLoading = Object.create(null);
      const contentQueue = [];
      let activeLoads = 0;

      const fieldMatches = (f, q) =>
        String(f.name || "").toLowerCase().indexOf(q) !== -1 ||
        String(f.title || "").toLowerCase().indexOf(q) !== -1 ||
        String(f.type || "").toLowerCase().indexOf(q) !== -1;

      /* 名称 / 字段：用精简全局索引即时匹配。 */
      const nameFieldMatch = (d, q) =>
        String(d.slug || "").toLowerCase().indexOf(q) !== -1 ||
        String(d.title || "").toLowerCase().indexOf(q) !== -1 ||
        (d.fields || []).some((f) => fieldMatches(f, q));

      /* 数据内容：命中已加载的单集索引。 */
      const contentMatch = (d, q) => {
        const c = contentCache[d.slug];
        return !!c && c.indexOf(q) !== -1;
      };

      const contentLoaded = (slug) => contentCache[slug] !== undefined;

      /* 全局搜索索引只收录已发布过数据的数据集（R7），因此每个条目都可能有内容索引可拉。 */
      const hasPending = (q) => !!q && docs.some((d) => !contentLoaded(d.slug));

      function enqueue(slug) {
        if (contentLoaded(slug) || contentLoading[slug]) return;
        contentLoading[slug] = true;
        contentQueue.push(slug);
        pump();
      }
      function pump() {
        while (activeLoads < MAX_CONCURRENT && contentQueue.length) {
          const slug = contentQueue.shift();
          activeLoads++;
          fetch(`/${encodeURIComponent(slug)}/search-index.json`, { headers: { accept: "application/json" } })
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.json();
            })
            .then((idx) => {
              const terms = Array.isArray(idx?.terms) ? idx.terms : [];
              contentCache[slug] = terms.join("\n").toLowerCase();
            })
            .catch(() => { contentCache[slug] = ""; })
            .then(() => {
              activeLoads--;
              delete contentLoading[slug];
              onContentLoaded();
              pump();
            });
        }
      }
      /* 命中关键词时把条目对应的单集内容索引按需入队（并发受限、失败即视为无内容命中）。 */
      const requestForSearch = (q) => {
        if (!q) return;
        docs.forEach((d) => { enqueue(d.slug); });
      };

      const scheduleRender = LT.debounce(() => { if (docs.length) render(); }, 80);
      function onContentLoaded() {
        if (input.value.trim()) scheduleRender();
      }

      function dcard(d, contentHit) {
        const card = LT.el("a", { class: "dcard", href: LT.datasetLink(d.slug) }, [
          LT.el("span", { class: "dcard__slug", text: d.slug }),
          LT.el("span", { class: "dcard__title", text: d.title || d.slug }),
        ]);
        const meta = LT.el("div", { class: "dcard__meta" });
        meta.appendChild(LT.el("span", { class: "tag tag--plain", text: `Schema ${d.schemaVersion || "—"}` }));
        meta.appendChild(LT.el("span", { class: "tag tag--plain", text: `数据 ${d.dataVersion || "—"}` }));
        meta.appendChild(LT.el("span", { class: "tag tag--plain", text: `${(d.fields || []).length} 字段` }));
        if (contentHit) meta.appendChild(LT.el("span", { class: "tag tag--plain", text: "数据内容命中" }));
        card.appendChild(meta);
        return card;
      }

      function searchableScope() {
        const names = [];
        docs.forEach((d) => {
          (d.fields || []).forEach((f) => {
            if (f && f.name && names.indexOf(f.name) === -1) names.push(f.name);
          });
        });
        const shown = names.slice(0, 12).join("、");
        const more = names.length > 12 ? ` 等 ${names.length} 个字段` : "";
        const slugs = docs.map((d) => d.slug).slice(0, 6).join("、");
        return `${shown || "（索引未声明字段名）"}${more}；数据集：${slugs || "（暂无）"}`;
      }

      function render() {
        const raw = input.value.trim();
        const q = raw.toLowerCase();
        requestForSearch(q);
        const matched = q
          ? docs.filter((d) => nameFieldMatch(d, q) || contentMatch(d, q))
          : docs;

        const searching = hasPending(q);
        const base = q
          ? `命中 ${matched.length} / ${docs.length} 个数据集`
          : `共 ${docs.length} 个数据集`;
        countEl.textContent = searching ? `${base} · 正在检索数据内容…` : base;

        LT.clear(results);

        if (docs.length === 0) {
          /* R5：空库显示「命中 0 / 0 个数据集」+「没有匹配的数据集。」，与故障态「搜索索引暂不可用」互斥。 */
          countEl.textContent = "命中 0 / 0 个数据集";
          results.appendChild(
            LT.emptyState(
              "没有匹配的数据集",
              "没有匹配的数据集。索引里还没有已发布数据的数据集；管理员发布后，其字段与数据内容会进入搜索索引。",
              LT.el("a", { class: "btn btn--sm", href: "/", text: "返回数据目录" }),
            ),
          );
          return;
        }

        if (matched.length === 0) {
          if (searching) {
            const pendingCards = LT.el("div", { class: "cards" });
            for (let i = 0; i < 3; i++) {
              pendingCards.appendChild(LT.el("div", { class: "card" }, [LT.skeleton(3)]));
            }
            results.appendChild(pendingCards);
            return;
          }
          results.appendChild(
            LT.emptyState(
              "没有匹配的数据集",
              `没有匹配的数据集。可搜范围：${searchableScope()}；换个关键词试试。`,
              LT.el("button", {
                class: "btn btn--sm",
                type: "button",
                text: "清空关键词",
                onclick: () => {
                  input.value = "";
                  render();
                  input.focus();
                },
              }),
            ),
          );
          return;
        }

        if (q && matched.length > 40) {
          const hint = LT.el("div", { class: "callout callout--info" }, [
            LT.el("div", { class: "stack", style: "margin:0" }, [
              LT.el("strong", {
                text: matched.length > 40 ? `结果过多（${matched.length} 项），请缩小范围` : "关键词过宽，请缩小范围",
              }),
              LT.el("p", {
                class: "muted",
                style: "margin:0",
                text: "补充关键词，或改用字段名、标题片段来收敛结果。",
              }),
            ]),
          ]);
          results.appendChild(hint);
        }

        const cards = LT.el("div", { class: "cards" });
        matched.forEach((d) => {
          const contentHit = !!q && !nameFieldMatch(d, q) && contentMatch(d, q);
          cards.appendChild(dcard(d, contentHit));
        });
        results.appendChild(cards);
      }

      function renderSkeleton() {
        countEl.textContent = "正在加载搜索索引…";
        LT.clear(results);
        const cards = LT.el("div", { class: "cards" });
        for (let i = 0; i < 3; i++) {
          cards.appendChild(LT.el("div", { class: "card" }, [LT.skeleton(3)]));
        }
        results.appendChild(cards);
      }

      function renderError() {
        countEl.textContent = "搜索索引暂不可用";
        LT.clear(results);
        results.appendChild(
          LT.emptyState(
            "搜索索引暂不可用",
            "无法读取 /search/index.json，请稍后重试。",
            LT.el("button", {
              class: "btn btn--sm",
              type: "button",
              text: "重试",
              onclick: load,
            }),
          ),
        );
      }

      function load() {
        renderSkeleton();
        LT.loadJsonStrict("/search/index.json")
          .then((index) => {
            docs = index?.datasets || [];
            render();
            if (docs.length <= CONTENT_PREFETCH_DOCS) {
              docs.forEach((d) => { enqueue(d.slug); });
            }
          })
          .catch(renderError);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        render();
      });

      input.addEventListener(
        "input",
        LT.debounce(() => {
          if (docs.length) render();
        }, 120),
      );

      clearBtn.addEventListener("click", () => {
        input.value = "";
        render();
        input.focus();
      });

      load();
    })();
  </script>
</body>
</html>
