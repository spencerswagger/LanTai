<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080a0f" />
  <title>数据集详情 · 兰台 LanTai</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="topbar" data-lt-topbar></header>

  <main id="main" tabindex="-1">
    <div class="container">
      <div id="view" role="status" aria-live="polite"></div>
    </div>
  </main>

  <footer class="sitefoot" data-lt-footer></footer>

  <script src="/app.js"></script>
  <script>
    (() => {
      "use strict";
      LT.mountShell({ active: "catalog" });

      var view = LT.$("#view");
      var slug = LT.param("slug");

      function th(label) {
        return LT.el("th", { scope: "col", text: label });
      }

      function pageHead(eyebrow, title, sub) {
        var head = LT.el("div", { class: "pagehead" }, [
          LT.el("p", { class: "eyebrow", text: eyebrow }),
          LT.el("h1", { text: title }),
        ]);
        if (sub) head.appendChild(sub);
        return head;
      }

      function renderSkeleton() {
        LT.clear(view);
        view.appendChild(LT.el("div", { class: "card", style: "margin-top:var(--s7)" }, [LT.skeleton(6)]));
      }

      function renderNoSlug() {
        LT.clear(view);
        view.appendChild(pageHead("数据集", "数据集详情"));
        view.appendChild(
          LT.el("div", { style: "padding-top:var(--s5)" }, [
            LT.emptyState(
              "未指定数据集",
              "链接里缺少 slug 参数，请从数据目录选择一个数据集查看详情。",
              LT.el("a", { class: "btn btn--sm", href: "/", text: "返回数据目录" }),
            ),
          ]),
        );
      }

      function renderMissing() {
        LT.clear(view);
        view.appendChild(pageHead("数据集", "未找到数据集"));
        view.appendChild(
          LT.el("div", { style: "padding-top:var(--s5)" }, [
            LT.emptyState(
              "该数据集不存在或尚未发布",
              `没有找到「${slug}」的清单文件，可能 slug 有误，或管理员尚未发布该数据集。`,
              LT.el("a", { class: "btn btn--sm", href: "/", text: "返回数据目录" }),
            ),
          ]),
        );
      }

      function renderError() {
        LT.clear(view);
        view.appendChild(pageHead("数据集", "数据集详情"));
        view.appendChild(
          LT.el("div", { style: "padding-top:var(--s5)" }, [
            LT.emptyState(
              "加载失败",
              "暂时无法读取该数据集的清单文件，请稍后重试。",
              LT.el("button", {
                class: "btn btn--sm",
                type: "button",
                text: "重试",
                onclick: load,
              }),
            ),
          ]),
        );
      }

      function resolveLocalRef(root, ref) {
        var cur;
        var parts;
        var k;
        var i;
        if (typeof ref !== "string" || ref.slice(0, 2) !== "#/") return null;
        cur = root;
        parts = ref.slice(2).split("/");
        for (i = 0; i < parts.length; i++) {
          if (!cur || typeof cur !== "object") return null;
          k = parts[i].replace(/~1/g, "/").replace(/~0/g, "~");
          cur = cur[k];
        }
        return cur && typeof cur === "object" ? cur : null;
      }
      /* 定位承载 properties 的 Schema 节点：根为 array 取 items；本地 $ref（#/$defs/* 等）解析一跳。 */
      function schemaContainer(schemaDoc) {
        var node;
        var resolved;
        if (!schemaDoc || typeof schemaDoc !== "object") return null;
        node = schemaDoc;
        if (node.type === "array" && node.items && typeof node.items === "object") node = node.items;
        if (node.$ref) {
          resolved = resolveLocalRef(schemaDoc, node.$ref);
          if (resolved) node = resolved;
        }
        return node;
      }
      function fieldsCard(schemaDoc) {
        var card = LT.el("div", { class: "card card--flush" });
        card.appendChild(
          LT.el("div", { class: "card__head" }, [LT.el("h2", { text: "字段说明" })]),
        );
        var container = schemaContainer(schemaDoc);
        var props =
          container?.properties && typeof container.properties === "object"
            ? container.properties
            : null;
        var names = props ? Object.keys(props) : [];
        if (names.length === 0) {
          card.appendChild(
            LT.el("div", { class: "card__body" }, [
              LT.el("p", { class: "muted", text: "该 Schema 未声明 properties，按约定接受任意字段。" }),
            ]),
          );
          return card;
        }
        var required = Array.isArray(container.required) ? container.required : [];
        var tbody = LT.el("tbody");
        names.forEach((name) => {
          var p = props[name] && typeof props[name] === "object" ? props[name] : {};
          tbody.appendChild(
            LT.el("tr", {}, [
              LT.el("td", { class: "mono", text: name }),
              LT.el("td", {}, [LT.el("span", { class: "tag tag--plain", text: p.type || "—" })]),
              LT.el("td", { text: p.title || "—" }),
              LT.el("td", {}, [
                required.indexOf(name) !== -1
                  ? LT.el("span", { class: "tag tag--published tag--plain", text: "必填" })
                  : LT.el("span", { class: "faint", text: "可选" }),
              ]),
            ]),
          );
        });
        var table = LT.el("table", { class: "table" }, [
          LT.el("thead", {}, [LT.el("tr", {}, [th("字段"), th("类型"), th("标题"), th("必填")])]),
          tbody,
        ]);
        card.appendChild(LT.el("div", { class: "table-wrap" }, [table]));
        return card;
      }

      function versionsCard(manifest) {
        var card = LT.el("div", { class: "card card--flush" });
        card.appendChild(
          LT.el("div", { class: "card__head" }, [LT.el("h2", { text: "数据版本" })]),
        );
        var versions = (manifest.dataVersions || []).slice().reverse();
        if (versions.length === 0) {
          card.appendChild(
            LT.el("div", { class: "card__body" }, [
              LT.el("p", { class: "muted", text: "该数据集尚未发布任何数据版本。" }),
              LT.el("a", { class: "btn btn--sm", href: `/submit?slug=${encodeURIComponent(manifest.slug)}`, text: "提交此数据集的数据" }),
            ]),
          );
          return card;
        }
        var tbody = LT.el("tbody");
        versions.forEach((v) => {
          var status;
          if (v.isLatest) status = LT.el("span", { class: "tag tag--published", text: "最新" });
          else if (v.isPreview) status = LT.el("span", { class: "tag tag--staged", text: "预发布" });
          else status = LT.el("span", { class: "tag tag--plain", text: "历史版本" });
          tbody.appendChild(
            LT.el("tr", {}, [
              LT.el("td", { class: "mono num", text: v.version }),
              LT.el("td", {}, [status]),
              LT.el("td", { text: LT.fmtDateTime(v.publishedAt) }),
              LT.el("td", {}, [
                LT.el("a", {
                  class: "mono",
                  href: `/${manifest.slug}/versions/${v.version}.json`,
                  text: "原始 JSON",
                }),
              ]),
            ]),
          );
        });
        var table = LT.el("table", { class: "table" }, [
          LT.el("thead", {}, [LT.el("tr", {}, [th("版本"), th("状态"), th("发布时间"), th("产物")])]),
          tbody,
        ]);
        card.appendChild(LT.el("div", { class: "table-wrap" }, [table]));
        return card;
      }

      function previewCard(manifest, latest) {
        var card = LT.el("div", { class: "card card--flush" });
        card.appendChild(
          LT.el("div", { class: "card__head" }, [LT.el("h2", { text: "数据预览" })]),
        );

        var body = LT.el("div", { class: "card__body stack" });
        var ver = (latest?.dataVersion) || manifest.latest || null;

        if (!ver) {
          body.appendChild(
            LT.el("p", { class: "muted", text: "该数据集尚未发布数据，暂无可预览的内容。" }),
          );
          card.appendChild(body);
          return card;
        }

        var rawUrl = `/${manifest.slug}/versions/${ver}.json`;

        body.appendChild(
          LT.el("p", { class: "muted" }, [
            "当前最新数据版本 ",
            LT.el("code", { text: ver }),
            "。预览按需加载、默认折叠，展开节点时才渲染下一层，避免大数据拖慢页面。",
          ]),
        );

        var status = LT.el("div", {
          class: "muted",
          role: "status",
          "aria-live": "polite",
          text: "尚未加载预览内容。",
        });
        var host = LT.el("div", { class: "stack" });

        var loadBtn = LT.el("button", {
          class: "btn btn--sm",
          type: "button",
          text: "加载数据预览",
        });
        var rawLink = LT.el("a", {
          class: "btn btn--sm btn--ghost",
          href: rawUrl,
          target: "_blank",
          rel: "noopener",
          text: "查看原始 JSON",
        });

        loadBtn.addEventListener("click", () => {
          LT.busy(loadBtn, true);
          status.textContent = "正在加载数据…";
          LT.loadJsonStrict(rawUrl)
            .then((data) => {
              LT.clear(host);
              host.appendChild(LT.dataTree(data, { collapsed: true }));
              status.textContent = "预览已加载，展开各节点查看内容。";
            })
            .catch(() => {
              status.textContent = "加载失败，请稍后重试，或直接查看原始 JSON。";
            })
            .finally(() => {
              LT.busy(loadBtn, false);
            });
        });

        body.appendChild(LT.el("div", { class: "cluster" }, [loadBtn, rawLink]));
        body.appendChild(status);
        body.appendChild(host);
        card.appendChild(body);
        return card;
      }

      function copyText(text, label) {
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(text);
        }
        LT.toast(label || "已复制到剪贴板", { type: "ok" });
      }

      function usageCard(manifest) {
        var s = manifest.slug;
        var origin = location.origin;
        var manifestUrl = `/${s}/manifest.json`;
        var latestUrl = `/${s}/latest.json`;
        var curl = `curl -s ${origin}${latestUrl}`;

        var card = LT.el("div", { class: "card" });
        card.appendChild(LT.el("h2", { text: "如何取用", style: "margin-top:0" }));
        card.appendChild(
          LT.el("p", {
            class: "muted",
            text: "以下是该数据集的公开读取地址，由 CDN 直读、零计算，可直接在程序或命令行取用。",
          }),
        );
        card.appendChild(
          LT.el("dl", { class: "kv" }, [
            LT.el("dt", { text: "清单文件" }),
            LT.el("dd", {}, [LT.el("a", { class: "mono", href: manifestUrl, text: manifestUrl })]),
            LT.el("dt", { text: "最新数据" }),
            LT.el("dd", {}, [LT.el("a", { class: "mono", href: latestUrl, text: latestUrl })]),
          ]),
        );
        card.appendChild(LT.el("pre", { class: "result", text: curl }));
        card.appendChild(
          LT.el("div", { class: "cluster", style: "margin-top:var(--s4)" }, [
            LT.el("button", {
              class: "btn btn--sm",
              type: "button",
              text: "复制 curl",
              onclick: () => {
                copyText(curl, "已复制 curl 命令");
              },
            }),
            LT.el("button", {
              class: "btn btn--sm btn--ghost",
              type: "button",
              text: "复制接口地址",
              onclick: () => {
                copyText(origin + latestUrl, "已复制接口地址");
              },
            }),
          ]),
        );
        card.appendChild(
          LT.el("div", { class: "cluster", style: "margin-top:var(--s5)" }, [
            LT.el("a", {
              class: "btn btn--primary",
              href: `/submit?slug=${encodeURIComponent(s)}`,
              text: "提交此数据集的数据",
            }),
            LT.el("a", { class: "btn btn--ghost", href: "/docs/", text: "开放接口文档" }),
          ]),
        );
        return card;
      }

      /* 稳定序列化：与平台侧一致（对象键递归按字典序排序，JSON.stringify 无多余空白）。 */
      function ltSortKeys(value) {
        if (Array.isArray(value)) return value.map(ltSortKeys);
        if (value !== null && typeof value === "object") {
          const out = {};
          Object.keys(value).sort().forEach((k) => { out[k] = ltSortKeys(value[k]); });
          return out;
        }
        return value;
      }
      function ltStableStringify(value) { return JSON.stringify(ltSortKeys(value)); }
      function ltToHex(buf) {
        return Array.prototype.map
          .call(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
      async function ltContentHash(payload) {
        var bytes = new TextEncoder().encode(ltStableStringify(payload));
        return ltToHex(await crypto.subtle.digest("SHA-256", bytes));
      }

      /* 离线复算命令：与页面同口径，可在本地对下载到的快照复查。 */
      var RECOMPUTE_CMD =
        "node -e 'const c=require(\"crypto\"),f=require(\"fs\");" +
        "const s=(v)=>Array.isArray(v)?v.map(s):(v!==null&&typeof v==\"object\"" +
        "?Object.keys(v).sort().reduce((o,k)=>(o[k]=s(v[k]),o),{}):v);" +
        "console.log(c.createHash(\"sha256\")" +
        ".update(JSON.stringify(s(JSON.parse(f.readFileSync(process.argv[1],\"utf8\")))))" +
        ".digest(\"hex\"))' ";

      /* M2：详情页首屏即给出「版本 + 哈希前 8 位 + 大小 + 下载 + 复制链接 + 原地重算」。 */
      function verifyBar(manifest, latestVersion, contentHash) {
        var hash8 = contentHash ? String(contentHash).slice(0, 8) : "—";
        var rawUrl = latestVersion
          ? `/${manifest.slug}/versions/${latestVersion}.json`
          : `/${manifest.slug}/latest.json`;
        var absUrl = location.origin + rawUrl;

        var sizeEl = LT.el("span", { class: "muted mono", text: "快照大小 计算中…" });
        /* 字节数只能从响应头拿：清单/指针里没有该字段，HEAD 拿不到，
           压缩后 content-length 也会被丢掉；reload 保证不用到缺头的旧缓存副本。 */
        fetch(absUrl, { method: "GET", cache: "reload" })
          .then((res) => {
            var len =
              res.headers.get("x-lantai-object-bytes") || res.headers.get("content-length");
            if (res.body && res.body.cancel) {
              try { res.body.cancel(); } catch (e) {}
            }
            var n = len ? Number(len) : NaN;
            sizeEl.textContent = Number.isFinite(n)
              ? `快照大小 ${typeof LT.fmtNumber === "function" ? LT.fmtNumber(n) : n.toLocaleString("zh-CN")} 字节`
              : "快照大小 —";
          })
          .catch(() => { sizeEl.textContent = "快照大小 —"; });

        var checkOut = LT.el("p", { class: "hint", style: "margin:0", role: "status", "aria-live": "polite" });

        var recomputeBtn = LT.el("button", {
          class: "btn btn--sm",
          type: "button",
          text: "在页面上重算",
        });
        recomputeBtn.addEventListener("click", () => {
          LT.busy(recomputeBtn, true);
          checkOut.textContent = "正在取回快照并按稳定序列化重算…";
          fetch(rawUrl, { cache: "reload" })
            .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
            .then((payload) => ltContentHash(payload))
            .then((hex) => {
              var same = !!contentHash && hex === contentHash;
              checkOut.textContent = same
                ? `重算结果 ${hex.slice(0, 8)}… 与页面显示、与指针一致 ✅ 这一版内容未被改动。`
                : `重算结果 ${hex.slice(0, 8)}… 与页面显示值不一致 ❌（页面值 ${hash8}）`;
            })
            .catch((err) => {
              checkOut.textContent = `重算失败：${(err && err.message) || "无法取回快照"}。`;
            })
            .finally(() => { LT.busy(recomputeBtn, false); });
        });

        var rowChildren = [
          LT.el("span", {
            class: "tag tag--published mono",
            text: latestVersion ? `最新数据 v${latestVersion}` : "尚无已发布数据",
          }),
          LT.el("span", { class: "muted", text: "内容哈希" }),
          LT.el("code", { class: "mono", text: hash8, title: contentHash || "" }),
          sizeEl,
          LT.el("a", {
            class: "btn btn--sm btn--primary",
            href: rawUrl,
            download: "",
            text: "下载快照 JSON",
          }),
          LT.el("button", {
            class: "btn btn--sm",
            type: "button",
            text: "复制快照链接",
            onclick: () => { copyText(absUrl, "已复制快照链接"); },
          }),
        ];
        if (latestVersion && contentHash) rowChildren.push(recomputeBtn);

        var card = LT.el("div", { class: "card" });
        card.appendChild(
          LT.el("div", { class: "card__head" }, [
            LT.el("h2", { style: "margin:0", text: "自行核对" }),
            LT.el("a", { class: "mono", href: rawUrl, text: `${manifest.slug}/latest.json` }),
          ]),
        );
        card.appendChild(
          LT.el("div", { class: "card__body stack" }, [
            LT.el("div", { class: "cluster" }, rowChildren),
            LT.el("p", {
              class: "hint",
              style: "margin:0",
              text:
                "如何自行核对（口径 = 稳定序列化）：① 下载上面的快照 JSON；" +
                "② 递归把对象键按字典序排序后 JSON.stringify（数组保序、无多余空白、UTF-8）；" +
                "③ 对结果算 sha256，其前 8 位应与上方「内容哈希」一致 ⇒ 这一版内容未被改动。" +
                "注意：直接对下载到的原始字节算 sha256 会得到不同值，不属本口径。",
            }),
            LT.el("details", {}, [
              LT.el("summary", { text: "展开可复制的离线重算命令" }),
              LT.el("pre", { class: "result", text: RECOMPUTE_CMD + `${latestVersion || "N"}.json` }),
              LT.el("div", { class: "cluster", style: "margin-top:var(--s3)" }, [
                LT.el("button", {
                  class: "btn btn--sm",
                  type: "button",
                  text: "复制重算命令",
                  onclick: () => { copyText(RECOMPUTE_CMD + `${latestVersion || "N"}.json`, "已复制重算命令"); },
                }),
              ]),
            ]),
            checkOut,
          ]),
        );
        return card;
      }

      function renderDataset(manifest, schemaDoc, latest) {
        LT.clear(view);

        var schemaVersion = (manifest.schema?.version) || null;
        var latestVersion = manifest.latest || (latest?.dataVersion) || null;
        var updatedAt = manifest.updatedAt || (latest?.publishedAt) || null;
        var contentHash = (latest?.contentHash) || null;

        view.appendChild(
          pageHead("数据集", manifest.title || manifest.slug, LT.el("p", { class: "lede mono", text: manifest.slug })),
        );

        var body = LT.el("div", { class: "stack-lg", style: "padding-top:var(--s6)" });
        view.appendChild(body);

        body.appendChild(verifyBar(manifest, latestVersion, contentHash));

        body.appendChild(
          LT.el("dl", { class: "kv" }, [
            LT.el("dt", { text: "Schema 版本" }),
            LT.el("dd", {}, [
              LT.el("span", {
                class: "tag tag--frozen tag--plain mono",
                text: schemaVersion || "—",
              }),
            ]),
            LT.el("dt", { text: "最新数据版本" }),
            LT.el("dd", { class: "mono", text: latestVersion || "尚无已发布数据" }),
            LT.el("dt", { text: "更新时间" }),
            LT.el("dd", { text: LT.fmtDateTime(updatedAt) }),
            LT.el("dt", { text: "内容哈希" }),
            LT.el("dd", {
              class: "mono truncate",
              text: contentHash || "—",
              title: contentHash || "",
            }),
          ]),
        );

        body.appendChild(fieldsCard(schemaDoc));
        body.appendChild(versionsCard(manifest));
        body.appendChild(previewCard(manifest, latest));
        body.appendChild(usageCard(manifest));
      }

      function load() {
        if (!slug) {
          renderNoSlug();
          return;
        }
        renderSkeleton();
        LT.loadJsonStrict(`/${slug}/manifest.json`)
          .then((manifest) => {
            var schemaUrl =
              (manifest.schema?.url) ||
              `/schemas/${slug}/${(manifest.schema?.version) || ""}.json`;
            return Promise.all([
              LT.loadJsonStrict(schemaUrl).catch(() => null),
              LT.loadJsonStrict(`/${slug}/latest.json`).catch(() => null),
            ]).then((res) => [manifest, res[0], res[1]]);
          })
          .then((t) => {
            renderDataset(t[0], t[1], t[2]);
          })
          .catch((err) => {
            if (err && err.status === 404) renderMissing();
            else renderError();
          });
      }

      load();
    })();
  </script>
</body>
</html>
