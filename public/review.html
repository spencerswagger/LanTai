<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LanTai 兰台 · 审阅台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a href="/">目录</a>
      <a href="/submit">匿名贡献</a>
      <a href="/admin">管理后台</a>
      <a href="/review" class="active">审阅台</a>
    </nav>

    <header class="top">
      <p class="eyebrow">LanTai Admin · 审阅</p>
      <h1>审阅预览与合并</h1>
      <p class="lede">
        左侧为待审队列（pending / staged）。选中后可对照三视图——结构化只读渲染、候选 JSON 树、
        与当前已发布版本的 diff——再执行预发布、正式发布或驳回。
      </p>
    </header>

    <section class="review-grid">
      <aside class="card">
        <h3>待审队列</h3>
        <button type="button" class="secondary" id="refresh-btn">刷新队列</button>
        <div id="queue" class="queue">（加载中…）</div>
      </aside>

      <div class="card">
        <div id="detail-empty" class="note">请从左侧选择一条待审提交。</div>
        <div id="detail" style="display:none">
          <h3>提交元数据</h3>
          <div id="meta" class="meta"></div>

          <h3>结构化渲染（render）</h3>
          <div id="render-view" class="render"></div>

          <h3>候选 JSON 树（jsonTree）</h3>
          <div id="json-tree" class="tree"></div>

          <h3>与当前版本 diff</h3>
          <p class="note">基准：<span id="diff-base" class="pill">-</span></p>
          <div id="diff-view" class="diff"></div>

          <h3>动作</h3>
          <div class="actions">
            <button type="button" class="secondary" id="stage-btn">预发布（stage）</button>
            <button type="button" id="promote-btn">正式发布（promote）</button>
            <button type="button" class="danger" id="reject-btn">驳回（reject）</button>
          </div>
          <label for="reject-reason">驳回原因（可选）</label>
          <input id="reject-reason" placeholder="说明驳回理由" />
          <pre id="out">// 动作结果将显示在这里</pre>
        </div>
      </div>
    </section>

    <footer>LanTai 兰台 · 数据典藏机构 · P4 审阅预览与合并</footer>
  </div>

  <script>
    const API = "/api/admin";
    const $ = (id) => document.getElementById(id);

    const showOut = (label, data) => {
      $("out").textContent = `// ${label}\n${typeof data === "string" ? data : JSON.stringify(data, null, 2)}`;
    };

    const api = async (path, init) => {
      const res = await fetch(path, init);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = body?.error
          ? `${res.status} ${body.error.code}: ${body.error.message}`
          : `${res.status}`;
        throw new Error(msg);
      }
      return body;
    };

    const post = (path, body) =>
      api(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body ?? {}),
      });

    let currentId = null;

    const loadQueue = async () => {
      const queue = $("queue");
      try {
        const { submissions } = await api(`${API}/submissions`);
        if (!submissions || submissions.length === 0) {
          queue.textContent = "（暂无待审提交）";
          return;
        }
        queue.textContent = "";
        for (const item of submissions) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "queue-item";
          btn.innerHTML =
            `<span class="queue-slug">${item.slug}</span>` +
            `<span class="pill">${item.status}</span>`;
          btn.onclick = () => selectSubmission(item.id);
          queue.appendChild(btn);
        }
      } catch (e) {
        queue.textContent = `加载失败：${e.message}`;
      }
    };

    const renderTreeNode = (value) => {
      if (value === null) return document.createTextNode("null");
      if (Array.isArray(value)) {
        const details = document.createElement("details");
        details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = `Array(${value.length})`;
        details.appendChild(summary);
        value.forEach((item, i) => {
          details.appendChild(treeRow(`[${i}]`, renderTreeNode(item)));
        });
        return details;
      }
      if (typeof value === "object") {
        const keys = Object.keys(value);
        const details = document.createElement("details");
        details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = `Object(${keys.length})`;
        details.appendChild(summary);
        for (const k of keys) {
          details.appendChild(treeRow(k, renderTreeNode(value[k])));
        }
        return details;
      }
      const span = document.createElement("span");
      span.className = "tree-val";
      span.textContent = typeof value === "string" ? `"${value}"` : String(value);
      return span;
    };

    const treeRow = (key, node) => {
      const row = document.createElement("div");
      row.className = "tree-row";
      const k = document.createElement("span");
      k.className = "tree-key";
      k.textContent = key;
      row.appendChild(k);
      row.appendChild(node);
      return row;
    };

    const renderFieldNode = (field) => {
      const wrap = document.createElement("div");
      wrap.className = "render-field";
      const label = document.createElement("div");
      label.className = "render-label";
      label.innerHTML =
        `<span class="render-key">${field.key}</span>` +
        `<span class="render-title">${field.title}</span>` +
        `<span class="pill">${field.type}</span>`;
      wrap.appendChild(label);
      if (field.children) {
        const kids = document.createElement("div");
        kids.className = "render-children";
        for (const child of field.children) kids.appendChild(renderFieldNode(child));
        wrap.appendChild(kids);
      } else {
        const val = document.createElement("div");
        val.className = "render-value";
        val.textContent =
          typeof field.value === "string" ? field.value : JSON.stringify(field.value);
        wrap.appendChild(val);
      }
      return wrap;
    };

    const renderDiff = (entry) => {
      const row = document.createElement("div");
      row.className = `diff-row diff-${entry.kind}`;
      const head = document.createElement("div");
      head.className = "diff-head";
      head.innerHTML = `<span class="pill">${entry.kind}</span><code>${entry.path || "/"}</code>`;
      row.appendChild(head);
      const body = document.createElement("div");
      body.className = "diff-body";
      const fmt = (v) => (v === undefined ? "—" : JSON.stringify(v));
      body.textContent = `before: ${fmt(entry.before)} ⇒ after: ${fmt(entry.after)}`;
      row.appendChild(body);
      return row;
    };

    const renderDetail = (views) => {
      $("detail-empty").style.display = "none";
      $("detail").style.display = "";

      const s = views.submission;
      $("meta").innerHTML = `
        <div><span class="meta-k">id</span><span class="meta-v">${s.id}</span></div>
        <div><span class="meta-k">slug</span><span class="meta-v">${s.slug}</span></div>
        <div><span class="meta-k">datasetId</span><span class="meta-v">${s.datasetId}</span></div>
        <div><span class="meta-k">status</span><span class="meta-v"><span class="pill">${s.status}</span></span></div>
        <div><span class="meta-k">schemaVersion</span><span class="meta-v">${s.schemaVersion}</span></div>
        <div><span class="meta-k">createdAt</span><span class="meta-v">${s.createdAt}</span></div>
        <div><span class="meta-k">hasEmail</span><span class="meta-v">${s.hasEmail}</span></div>`;

      const renderView = $("render-view");
      renderView.textContent = "";
      for (const field of views.render || []) renderView.appendChild(renderFieldNode(field));

      const tree = $("json-tree");
      tree.textContent = "";
      tree.appendChild(renderTreeNode(views.jsonTree));

      $("diff-base").textContent = views.diffBase || "-";
      const diffView = $("diff-view");
      diffView.textContent = "";
      if (!views.diff || views.diff.length === 0) {
        diffView.textContent = "（与当前版本无差异）";
      } else {
        for (const entry of views.diff) diffView.appendChild(renderDiff(entry));
      }
    };

    const selectSubmission = async (id) => {
      currentId = id;
      try {
        const views = await api(`${API}/submissions/${id}`);
        renderDetail(views);
      } catch (e) {
        showOut("加载三视图失败", String(e.message ?? e));
      }
    };

    const afterAction = async (label, promise) => {
      try {
        const result = await promise;
        showOut(label, result);
        await loadQueue();
        if (currentId) await selectSubmission(currentId);
      } catch (e) {
        showOut(`${label}失败`, String(e.message ?? e));
      }
    };

    $("refresh-btn").onclick = () => loadQueue();

    $("stage-btn").onclick = () => {
      if (!currentId) return showOut("预发布失败", "请先选择提交");
      afterAction("预发布结果", post(`${API}/submissions/${currentId}/stage`));
    };

    $("promote-btn").onclick = () => {
      if (!currentId) return showOut("正式发布失败", "请先选择提交");
      afterAction("正式发布结果", post(`${API}/submissions/${currentId}/promote`));
    };

    $("reject-btn").onclick = () => {
      if (!currentId) return showOut("驳回失败", "请先选择提交");
      const reason = $("reject-reason").value.trim();
      afterAction("驳回结果", post(`${API}/submissions/${currentId}/reject`, { reason }));
    };

    loadQueue().catch((e) => showOut("初始化失败", String(e.message ?? e)));
  </script>

  <style>
    .review-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .review-grid {
        grid-template-columns: 1fr;
      }
    }
    .queue {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--rule);
      font-weight: 500;
      text-align: left;
    }
    .queue-item:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .queue-slug {
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .meta {
      font-size: 0.88rem;
    }
    .meta > div {
      display: flex;
      gap: 10px;
      padding: 3px 0;
      border-bottom: 1px dashed var(--rule);
    }
    .meta-k {
      width: 120px;
      color: var(--muted);
    }
    .meta-v {
      word-break: break-all;
    }
    .render-field {
      border-left: 2px solid var(--rule);
      padding: 2px 0 2px 10px;
      margin: 4px 0;
    }
    .render-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }
    .render-key {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--accent);
    }
    .render-title {
      color: var(--ink);
      font-weight: 600;
    }
    .render-children {
      margin-left: 14px;
    }
    .render-value {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .tree {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.82rem;
      background: #fbfbfe;
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 10px 14px;
      max-height: 360px;
      overflow: auto;
    }
    .tree details {
      margin-left: 12px;
    }
    .tree-row {
      margin-left: 14px;
    }
    .tree-key {
      color: var(--accent);
      margin-right: 6px;
    }
    .tree-val {
      color: var(--muted);
    }
    .diff-row {
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 6px 0;
      font-size: 0.85rem;
    }
    .diff-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .diff-body {
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--muted);
      margin-top: 4px;
      word-break: break-all;
    }
    .diff-added {
      border-color: rgba(18, 165, 148, 0.4);
    }
    .diff-removed {
      border-color: rgba(180, 38, 31, 0.35);
    }
    .diff-changed {
      border-color: rgba(180, 83, 9, 0.35);
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button.danger {
      background: var(--danger);
    }
  </style>
</body>
</html>
